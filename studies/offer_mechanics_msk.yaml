# Прогон по запросу Романа (17.08.2026): связка базы креативов и панели.
#
# Стимулы НЕ придуманы: это шесть офферных механик, реально доминирующих в
# московской рекламе застройщиков по данным базы (12 326 целевых креативов,
# май–июнь 2026, PAN-17). Формулировки взяты из фактических слоганов макетов,
# из них убраны названия ЖК, брендов и станций метро — иначе тест мерил бы
# знание марки, а не силу механики (урок прогона pik_vs_samolet).
#
# Зона метода: зелёная. Это ранжирование текстовых сообщений внутри сегмента,
# а не предтест креатива целиком и не прогноз конверсии.
name: offer_mechanics_msk
type: claims_ranking
question_scale: purchase_intent   # вопрос решения: под каким условием купили бы

stimuli:
  - id: RASSROCHKA
    text: "Квартира в рассрочку 0% с первоначальным взносом от 10%"
  - id: SKIDKA
    text: "Квартиры в новостройке со скидками до 40%"
  - id: GOTOVOE
    text: "Дом сдан — готовые квартиры с отделкой, ключи сразу"
  - id: SEMEYNAYA
    text: "Семейная ипотека 3,5% с лимитом до 30 млн рублей"
  - id: START
    text: "Старт продаж нового корпуса — лучшие планировки по цене старта"
  - id: TREYD_IN
    text: "Меняем вашу старую квартиру на новую по программе трейд-ин"

segments: [nam_stalo_tesno, kvartira_rebenku, berut_na_kotlovane]
respondents_per_segment: 10
samples_per_respondent: 4

notes: >
  Мощность 10 профилей × 4 генерации выбрана по опыту прогона pik_vs_samolet:
  при 2 генерациях пара-ловушка давала пограничное значение. Решение о
  мощности принято ДО генерации ответов.

  Частоты механик в базе (доля целевых креативов, PAN-17): рассрочка 21,8%,
  скидка 17,0%, готовое жильё 9,7%, старт продаж 4,9%, ипотека общая 4,0%,
  семейная ипотека 2,8%, трейд-ин 1,3%. Набор стимулов покрывает то, на что
  рынок реально тратит показы, а не то, что кажется интересным теоретически.

  Отдельный смысл трейд-ина: механика редкая по рынку (1,3%), но «Эталон»
  ставит на неё 55% своих макетов. Вопрос, работает ли она на этих трёх
  сегментах, имеет прямую цену для конкурента.

  Ограничения чтения: только относительный порядок и разрыв внутри сегмента;
  никаких «X% выберут». Механика тестируется голой, без цены объекта, района
  и срока — реальный выбор всегда сложнее, и результат читается как
  сравнительная привлекательность условия, а не как прогноз продаж.
